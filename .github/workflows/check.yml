name: Software compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: 'python -m pip install --only-binary=:all: -r requirements.txt -r requirements-test.txt'
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m pip_audit

  dependabot-metadata:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify dependency metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3 (Node 24)
        with:
          github-token: ${{ github.token }}
      - name: Record update type
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: test -n "$UPDATE_TYPE"
